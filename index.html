<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Menaxhimi i Studentëve</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <main class="container">

    <h1>Menaxhimi i Studentëve</h1>

    <p class="nentitull">
      Seminar-Laboratori 1 – Inxhinieri Programesh
    </p>

    <section>
      <h2>Regjistrimi i studentit</h2>

      <form id="studentForm" novalidate>
        <input
          type="text"
          id="emri"
          placeholder="Emri i studentit"
          aria-label="Emri i studentit"
          aria-describedby="gabimi"
          required
        >

        <button type="submit">
          Shto studentin
        </button>
      </form>

      <p id="gabimi" role="alert"></p>
    </section>

    <section>
      <p class="statistika">
        Numri total i studentëve:
        <strong id="numriStudenteve">0</strong>
      </p>
    </section>

    <section class="seksioni-kerko">
      <label for="kerko">Kërko student</label>

      <input
        type="search"
        id="kerko"
        placeholder="Kërko sipas emrit..."
        autocomplete="off"
      >
    </section>

    <section>
      <h2>Lista e studentëve</h2>

      <p id="mesazhi" aria-live="polite"></p>
      <ul id="lista"></ul>
    </section>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
